name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一 ref で新しい実行が始まったら、古い実行はキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # lint / format / test だけを速く回す。実測値の正は元リポジトリ（ama-tan/jdoc-bench）の CI（#190）
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # samples/ や groundtruth/ が誤って公開側に混ざっていないかを確認する（非公開データの流出ガード）。
      # .gitignore で追跡対象には入らない想定だが、force add 等で紛れ込んだ場合に検出して落とす。
      # 階層の深さに関わらず検出するため (^|/) で判定し、大文字拡張子（.PDF 等）も拾う
      - name: 非公開データの流出ガードを確認
        run: |
          leaked=$(git ls-files | grep -iE '\.(pdf|docx|pptx|xlsx)$|(^|/)(samples|groundtruth|results)/' || true)
          if [ -n "$leaked" ]; then
            echo "非公開データ（PDF/DOCX/PPTX/XLSX や samples/groundtruth/results 配下）が追跡されています:"
            echo "$leaked"
            exit 1
          fi

      # シンボリックリンク経由で非公開データを指し込む迂回も拒否する（git のモード 120000）
      - name: シンボリックリンクの追跡を禁止
        run: |
          symlinks=$(git ls-files -s | awk '$1=="120000" {print $4}')
          if [ -n "$symlinks" ]; then
            echo "シンボリックリンクが追跡されています（非公開データの迂回に使われうるため禁止）:"
            echo "$symlinks"
            exit 1
          fi

      # 公開サイト（site/）の流出ガード（jdoc-bench#271）。site/ が無ければ何もしない。
      # 置いてよいのは .html と .json だけ。HTML に外部読み込み・埋め込み（禁止したタグ・data URI・
      # CSS の url()・javascript:）が無いこと、1 ファイル 300KB 未満であること、YomiToku の結果
      # （アダプタ名 yomitoku）が無いことを確かめる。固定の注記に「YomiToku」が出るので大文字小文字は区別する
      - name: 公開サイト（site/）のファイルと中身を検査
        run: |
          files=$(git ls-files site)
          if [ -z "$files" ]; then
            echo "site/ がないため検査を省略します"
            exit 0
          fi
          status=0
          others=$(echo "$files" | grep -vE '\.(html|json)$' || true)
          if [ -n "$others" ]; then
            echo "site/ に .html / .json 以外のファイルがあります:"
            echo "$others"
            status=1
          fi
          html=$(echo "$files" | grep -E '\.html$' || true)
          if [ -n "$html" ]; then
            hits=$(echo "$html" | xargs grep -niE '<[[:space:]]*(img|script|iframe|object|embed|link)\b|data:|url\(|javascript:' || true)
            if [ -n "$hits" ]; then
              echo "site/ の HTML に禁止したタグ・data:・url(・javascript: があります:"
              echo "$hits"
              status=1
            fi
            hits=$(echo "$html" | xargs grep -n 'yomitoku' || true)
            if [ -n "$hits" ]; then
              echo "site/ の HTML に yomitoku があります（結果を載せない）:"
              echo "$hits"
              status=1
            fi
          fi
          large=$(echo "$files" | xargs stat -c '%s %n' | awk '$1 >= 300000')
          if [ -n "$large" ]; then
            echo "site/ に 300KB（300000 バイト）以上のファイルがあります:"
            echo "$large"
            status=1
          fi
          exit $status

      # Level 0 パーサー（外部コマンド）。アダプタは available() で有無を自己申告するため、
      # 無くても lint / test は通るが、実 PDF のテストを CI で走らせるためにここで入れる。
      # tesseract-ocr-jpn は Tesseract（tesseract / tesseract_psm6 アダプタ）の日本語の学習データ（#196）。
      # fonts-noto-cjk は埋め込みの無い日本語フォントの代替先。Ubuntu ランナーには日本語フォントが無く、
      # ページ画像の日本語が空白になって Docling のレイアウト推論が変わる（#157）
      - name: poppler-utils・mupdf-tools・Tesseract（jpn）と日本語フォントをインストール
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils mupdf-tools fonts-noto-cjk tesseract-ocr tesseract-ocr-jpn

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pdf2json をインストール
        run: npm install -g pdf2json@4.1.0

      - name: ツールのバージョンを表示
        run: |
          pdftotext -v 2>&1 | head -1
          pdf2json --version 2>&1 | head -1
          tesseract --version 2>&1 | head -1
          tesseract --list-langs 2>&1 | grep -x jpn

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv.lock どおりに環境を再現する（lock がずれていれば失敗させる）
      - name: 依存関係のインストール
        run: uv sync --frozen --all-extras

      # site/ の HTML が data.json（数値だけ）と documents.json（公開情報）の純関数であることを、
      # 再生成して差分が無いことで確かめる（手で足した文字列があれば落ちる。jdoc-bench#271）
      - name: 公開サイト（site/）を再生成して差分が無いことを確認
        run: |
          if [ -z "$(git ls-files site)" ]; then
            echo "site/ がないため検査を省略します"
            exit 0
          fi
          out=$(mktemp -d)
          uv run jdocbench site site/data.json --meta site/documents.json --out "$out"
          cp site/data.json site/documents.json "$out"/
          if ! diff -r "$out" site; then
            echo "site/ が data.json と documents.json から再生成したものと一致しません（上の差分を参照）"
            exit 1
          fi

      - name: Lint
        run: uv run ruff check .

      - name: フォーマット確認
        run: uv run ruff format --check .

      - name: テスト
        run: uv run pytest
